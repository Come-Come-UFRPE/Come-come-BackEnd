spring.application.name=cadastro
server.port=8081

#DATABASE CONFIG
spring.datasource.url= jdbc:postgresql://localhost:5431/postgres
spring.datasource.username=postgres
spring.datasource.password=senha123
spring.jpa.hibernate.ddl-auto=update
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=boilerplate
spring.rabbitmq.password=boilerplate


#S3 CONFIG (fotos de perfil)
# Credenciais vêm da cadeia padrão da AWS: IAM Role da EC2 em produção,
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY ou ~/.aws localmente.
aws.region=us-east-1
aws.s3.bucket=boilerplate

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true