services:

  # Eureka Server
  eureka-server:
    build: ./eureka-server/.
    container_name: eureka-server
    ports:
      - '${EUREKA_PORT}:8761'
    environment:
      - 'MANAGEMENT_SERVER_PORT=9000'
    networks:
      - nt-general-come-come

  # API Gateway
  api-gateway:
    build: ./api-gateway/.
    ports:
      - '${GATEWAY_PORT}:${GATEWAY_PORT}'
    environment:
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true'
      - 'SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWERCASE-SERVICE-ID=true'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
      - 'SPRING_DATA_REDIS_PASSWORD=${GLOBAL_PASSWORD}'
      - 'SERVER_PORT=${GATEWAY_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'JAVA_TOOL_OPTIONS=-Dreactor.netty.http.server.accessLogEnabled=true'
      - 'SPRING_APPLICATION_NAME=api-gateway'
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - nt-general-come-come

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${GLOBAL_PASSWORD}
      - RABBITMQ_NODENAME=rabbit@rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nt-general-come-come
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: 'redis:latest'
    ports:
      - '${REDIS_PORT}:6379'
    environment:
      - 'REDIS_PASSWORD=${GLOBAL_PASSWORD}'
    command: redis-server --requirepass ${GLOBAL_PASSWORD}
    networks:
      - nt-general-come-come
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GLOBAL_PASSWORD}", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Banco de Dados PostgreSQL Unificado ---
  postgres:
    image: 'postgres:16-alpine'
    container_name: postgres
    environment:
      - 'POSTGRES_DB=${DB_OFF_NAME:-ms-off}'
      - 'POSTGRES_PASSWORD=${GLOBAL_PASSWORD}'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_HOST_AUTH_METHOD=md5'
      - 'POSTGRES_MULTIPLE_DATABASES=${DB_CADASTRO_NAME},${DB_ANAMNESE_NAME},${DB_HISTORICO_NAME},${DB_FAVORITOS_NAME}'
    ports:
      - '5432:5432'
    networks:
      nt-general-come-come:
        aliases:
          - postgres-off
          - postgres-cadastro
          - postgres-anamnese
          - postgres-historico
          - postgres-favoritos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_OFF_NAME:-ms-off} -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./scripts/init-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh
      - ./OFF-Come-come/src/main/resources/OFF.sql:/docker-entrypoint-initdb.d/01-init-off.sql
      - postgres_data:/var/lib/postgresql/data

  ms-off:
    build: ./OFF-Come-come/.
    ports:
      - '${MS_OFF_PORT}:${MS_OFF_PORT}'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_OFF_NAME}'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=${GLOBAL_PASSWORD}'
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SERVER_PORT=${MS_OFF_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'SPRING_APPLICATION_NAME=OPENFOODFACTS'
      - 'SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT=300000'
      - 'SPRING_DATASOURCE_HIKARI_INITIALIZATION-FAIL-TIMEOUT=-1'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=none'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}'
      - 'SPRING_RABBITMQ_PASSWORD=${GLOBAL_PASSWORD}'
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nt-general-come-come

  ms-cadastro:
    build: ./Cadastro-Come-come/.
    ports:
      - '${MS_CADASTRO_PORT}:${MS_CADASTRO_PORT}'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_CADASTRO_NAME}'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=${GLOBAL_PASSWORD}'
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SERVER_PORT=${MS_CADASTRO_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'SPRING_APPLICATION_NAME=CADASTRO'
      - 'AWS_REGION=${AWS_REGION}'
      - 'AWS_S3_BUCKET=${AWS_S3_BUCKET}'
      # Só para desenvolvimento local. Em produção ficam vazias e o SDK usa a IAM Role da EC2.
      - 'AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}'
      - 'AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}'
      - 'SPRING_RABBITMQ_PASSWORD=${GLOBAL_PASSWORD}'
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nt-general-come-come

  ms-anamnese:
    build: ./Anamnese-Come-come/.
    ports:
      - '${MS_ANAMNESE_PORT}:${MS_ANAMNESE_PORT}'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_ANAMNESE_NAME}'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=${GLOBAL_PASSWORD}'
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SERVER_PORT=${MS_ANAMNESE_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'SPRING_APPLICATION_NAME=ANAMNESE'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}'
      - 'SPRING_RABBITMQ_PASSWORD=${GLOBAL_PASSWORD}'
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nt-general-come-come

  ms-historico:
    build: ./Historico-come-come-main/.
    ports:
      - '${MS_HISTORICO_PORT}:${MS_HISTORICO_PORT}'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_HISTORICO_NAME}'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=${GLOBAL_PASSWORD}'
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SERVER_PORT=${MS_HISTORICO_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'SPRING_APPLICATION_NAME=HISTORICO'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}'
      - 'SPRING_RABBITMQ_PASSWORD=${GLOBAL_PASSWORD}'
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-off:
        condition: service_started
    networks:
      - nt-general-come-come

  # --- MS EMAIL ---
  ms-email:
    build: ./Email-Come-come/.
    ports:
      - '${MS_EMAIL_PORT}:${MS_EMAIL_PORT}'
    environment:
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SERVER_PORT=${MS_EMAIL_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'SPRING_APPLICATION_NAME=EMAIL'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}'
      - 'SPRING_RABBITMQ_PASSWORD=${GLOBAL_PASSWORD}'
      - 'SPRING_MAIL_HOST=${SMTP_HOST}'
      - 'SPRING_MAIL_PORT=${SMTP_PORT}'
      - 'SPRING_MAIL_USERNAME=${SMTP_USER}'
      - 'SPRING_MAIL_PASSWORD=${SMTP_PASS}'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true'
      - 'SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true'
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ms-cadastro:
        condition: service_started
    networks:
      - nt-general-come-come

  # --- MS FAVORITOS ---
  ms-favoritos:
    build: ./favorite/.
    ports:
      - '${MS_FAVORITOS_PORT}:${MS_FAVORITOS_PORT}'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_FAVORITOS_NAME}'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=${GLOBAL_PASSWORD}'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=update'
      - 'SPRING_JPA_SHOW_SQL=true'
      - 'SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true'
      - 'SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect'
      - 'SPRING_JACKSON_SERIALIZATION_FAIL_ON_EMPTY_BEANS=false'
      - 'EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/'
      - 'EUREKA_CLIENT_REGISTER-WITH-EUREKA=true'
      - 'EUREKA_CLIENT_FETCH-REGISTRY=true'
      - 'SERVER_PORT=${MS_FAVORITOS_PORT}'
      - 'MANAGEMENT_SERVER_PORT=9000'
      - 'SPRING_APPLICATION_NAME=FAVORITE'
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - nt-general-come-come

  prometheus:
    image: 'prom/prometheus:v3.16.0'
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - nt-general-come-come
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    image: 'grafana/loki:3.6.22'
    container_name: loki
    command: ['-config.file=/etc/loki/loki-config.yaml']
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - nt-general-come-come
    restart: unless-stopped

  alloy:
    image: 'grafana/alloy:v1.22.0'
    container_name: alloy
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - nt-general-come-come
    restart: unless-stopped

  grafana:
    image: 'grafana/grafana:13.3.2'
    container_name: grafana
    ports:
      - '${GRAFANA_PORT}:3000'
    environment:
      - 'GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}'
      - 'GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD no .env}'
      - 'GF_SECURITY_DISABLE_GRAVATAR=true'
      - 'GF_USERS_ALLOW_SIGN_UP=false'
      - 'GF_AUTH_ANONYMOUS_ENABLED=false'
      - 'GF_ANALYTICS_REPORTING_ENABLED=false'
      - 'GF_ANALYTICS_CHECK_FOR_UPDATES=false'
      - 'GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/comecome-overview.json'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - nt-general-come-come
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

networks:
  nt-general-come-come:
    name: ${NETWORK_NAME}
    driver: bridge
